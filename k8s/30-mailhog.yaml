apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: user-platform
  labels:
    app: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
          readinessProbe:
            tcpSocket:
              port: 1025
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: user-platform
spec:
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog-ui
  namespace: user-platform
spec:
  type: NodePort
  selector:
    app: mailhog
  ports:
    - name: http
      port: 8025
      targetPort: 8025
      nodePort: 30825
